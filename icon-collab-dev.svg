<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Collaborative Git Architecture Icon">
  <defs>
    <linearGradient id="coBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2636" />
      <stop offset="100%" stop-color="#071121" />
    </linearGradient>
    <filter id="cglow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#coBg)" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.5" />
  <path d="M 22 15 L 22 43" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 22 36 C 22 25, 42 29, 42 18" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" filter="url(#cglow)" />
  <circle cx="22" cy="15" r="4" fill="#0B162B" stroke="#38BDF8" stroke-width="2.2" />
  <circle cx="22" cy="41" r="4" fill="#0B162B" stroke="#38BDF8" stroke-width="2.2" />
  <circle cx="42" cy="18" r="4" fill="#34D399" filter="url(#cglow)">
    <animate attributeName="r" values="3.5;5;3.5" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="32" y="56" text-anchor="middle" fill="#6EE7B7" font-family="Consolas, Menlo, monospace" font-size="8.2" font-weight="700">GIT::CI</text>
</svg>
